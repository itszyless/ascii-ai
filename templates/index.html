<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrcaAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=orca2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><img class="brand-logo" src="/static/favicon.svg?v=orca2" alt=""><span>OrcaAI</span></div>
        <button class="icon-btn sidebar-toggle" id="toggleSidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <button class="icon-btn mobile-close" id="closeSidebar" title="Close sidebar">×</button>
      </div>

      <button class="new-chat-btn" id="newChat">
        <span class="plus">＋</span>
        <span>New chat</span>
      </button>

      <div class="chat-section-label">Chats</div>
      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-footer">
        <div class="product-footer">
          <img class="footer-logo" src="/static/favicon.svg?v=orca2" alt="">
          <div>
            <div class="status-title">Orca AI</div>
            <div class="status-sub">Beta v0.1</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="openSidebar" title="Open sidebar">☰</button>
        <button class="icon-btn desktop-sidebar-open" id="desktopSidebarOpen" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="model-name">OrcaAI</div>
        <div class="local-pill">LOCAL</div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-logo"><img src="/static/favicon.svg?v=orca2" alt="OrcaAI"></div>
          <h1>How can I help?</h1>
          <p>Your model, running on your computer.</p>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" placeholder="Message OrcaAI" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" title="Send">↑</button>
        </form>
        <div class="composer-meta">
          OrcaAI can make mistakes. Everything here stays on this machine.
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="renameModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
      <div class="modal-title" id="renameTitle">Rename chat</div>
      <div class="modal-subtitle">Choose a new name for this conversation.</div>
      <input class="modal-input" id="renameInput" maxlength="60" autocomplete="off" placeholder="Chat name">
      <div class="modal-actions">
        <button class="modal-btn secondary" id="renameCancel" type="button">Cancel</button>
        <button class="modal-btn primary" id="renameSave" type="button">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="modal-title" id="deleteTitle">Delete chat?</div>
      <div class="modal-subtitle">This will permanently delete this conversation.</div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="deleteCancel" type="button">Cancel</button>
        <button class="modal-btn danger" id="deleteConfirm" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
