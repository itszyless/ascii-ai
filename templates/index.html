<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">LocalAI</div>
        <button class="icon-btn mobile-close" id="closeSidebar" title="Close sidebar">×</button>
      </div>

      <button class="new-chat-btn" id="newChat">
        <span class="plus">＋</span>
        <span>New chat</span>
      </button>

      <div class="chat-section-label">Chats</div>
      <div class="chat-list" id="chatList"></div>

      <a class="lab-link" href="/lab">
        <span>◇</span>
        <span>Model Lab</span>
      </a>

      <div class="sidebar-footer">
        <div class="status-row">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <div class="status-title" id="statusTitle">Checking model…</div>
            <div class="status-sub" id="statusSub">Local only</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="openSidebar" title="Open sidebar">☰</button>
        <div class="model-name">LocalAI v3</div>
        <div class="local-pill">LOCAL</div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">L</div>
          <h1>How can I help?</h1>
          <p>Your model, running on your computer.</p>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" placeholder="Message LocalAI" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" title="Send">↑</button>
        </form>
        <div class="composer-meta">
          LocalAI can make mistakes. Everything here stays on this machine.
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
